    <!-- Telegram WebApp JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Gracefully handle HMR WebSocket disconnection in sandbox environment
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          (typeof event.reason.message === 'string' && (event.reason.message.includes('WebSocket') || event.reason.message.includes('vite:ws'))) ||
          (typeof event.reason.stack === 'string' && event.reason.stack.includes('@vite/client'))
        )) {
          event.preventDefault();
        }
      });
    </script>
